<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الذكي</title>

```
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
    }

    .container {
        max-width: 800px;
        margin: 60px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    #question {
        width: 100%;
        box-sizing: border-box;
        min-height: 120px;
        padding: 15px;
        font-size: 18px;
        border-radius: 10px;
        border: 1px solid #444;
        background: #222;
        color: white;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 15px;
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #fff;
        color: #111;
    }

    button:hover {
        background: #ddd;
    }

    #answer {
        margin-top: 25px;
        padding: 20px;
        min-height: 80px;
        border-radius: 10px;
        background: #222;
        white-space: pre-wrap;
        line-height: 1.7;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>موقعي الذكي</h1>

<textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>

<button onclick="askQuestion()">إرسال</button>

<div id="answer">ستظهر الإجابة هنا...</div>
```

</div>

<script>

async function askQuestion() {

    const question = document.getElementById("question").value.trim();
    const answer = document.getElementById("answer");

    if (!question) {
        answer.textContent = "اكتب سؤالاً أولاً.";
        return;
    }

    answer.textContent = "جاري التفكير...";

    try {

        const response = await fetch("http://127.0.0.1:8000/ask", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (data.answer) {
            answer.textContent = data.answer;
        } else {
            answer.textContent =
                "حدث خطأ: " + (data.error || "لم تصل إجابة.");
        }

    } catch (error) {

        answer.textContent =
            "لم أستطع الاتصال بالسيرفر.\n\n" +
            "تأكد أن server.py يعمل.";
    }
}

</script>

</body>
</html>
