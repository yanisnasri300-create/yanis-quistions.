<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanis Questions</title>
</head>

<body>
    <h1>Yanis Questions</h1>

    <input id="question" type="text" placeholder="Ask a question">
    <button onclick="askQuestion()">Ask</button>

    <p id="answer"></p>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value;
            const answer = document.getElementById("answer");

            answer.textContent = "Thinking...";

            try {
                const response = await fetch(
                    "https://yanis-questions.onrender.com/ask",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ question: question })
                    }
                );

                const data = await response.json();

                answer.textContent = data.answer || data.error || "No answer.";
            } catch (error) {
                answer.textContent = "The server could not be reached.";
            }
        }
    </script>
</body>
</html>
